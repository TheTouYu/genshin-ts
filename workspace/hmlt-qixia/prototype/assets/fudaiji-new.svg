<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 22">
  <defs>
    <linearGradient id="wblade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a20"/>
      <stop offset=".35" stop-color="#ffb347"/>
      <stop offset=".75" stop-color="#ffe9c4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="wgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/><stop offset=".5" stop-color="#d8942f"/><stop offset="1" stop-color="#8a5a1a"/>
    </linearGradient>
    <linearGradient id="wtrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a00" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd479" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- 微型尾焰 -->
  <line x1="1" y1="11" x2="7" y2="11" stroke="url(#wtrail)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 微型剑柄 -->
  <rect x="8" y="9.9" width="4.4" height="2.2" rx="0.5" fill="#5a200e"/>
  <circle cx="7.2" cy="11" r="1.3" fill="url(#wgold)"/>

  <!-- 微型云头格 -->
  <path d="M13.4 7.2 C 12.2 9, 12.2 13, 13.4 14.8 L 15.4 14 C 14.3 12, 14.3 10, 15.4 8 Z" fill="url(#wgold)" stroke="#8a5a1a" stroke-width=".35"/>

  <!-- 剑身（双刃+中脊） -->
  <path d="M15.6 8.6 C 15 9.8, 15 12.2, 15.6 13.4 L 24.5 11.5 L 29 11 L 24.5 10.5 Z" fill="url(#wblade)"/>
  <path d="M17 11 L 27 11" stroke="#ffffff" stroke-width=".6" opacity=".8"/>
</svg>
