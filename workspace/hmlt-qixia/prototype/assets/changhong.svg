<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 44">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a20"/>
      <stop offset=".30" stop-color="#ffb347"/>
      <stop offset=".72" stop-color="#ffe9c4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/><stop offset=".5" stop-color="#d8942f"/><stop offset="1" stop-color="#8a5a1a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a00" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd479" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 剑气尾焰（飞行拖尾） -->
  <ellipse cx="92" cy="22" rx="52" ry="9" fill="url(#halo)"/>
  <line x1="0" y1="15" x2="20" y2="15" stroke="url(#trail)" stroke-width="1.6"/>
  <line x1="-2" y1="22" x2="24" y2="22" stroke="url(#trail)" stroke-width="2.6"/>
  <line x1="0" y1="29" x2="20" y2="29" stroke="url(#trail)" stroke-width="1.6"/>

  <!-- 剑穗（剑首垂绦，向左飘） -->
  <path d="M18 22 C 11 27, 5 21, 1 27" fill="none" stroke="#e03c1e" stroke-width="2.2" stroke-linecap="round" opacity=".95"/>
  <path d="M19 22 C 13 25, 8 22, 4 26" fill="none" stroke="#ff7a4d" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <circle cx="14" cy="23.4" r="1" fill="#ffd479"/>

  <!-- 剑柄（缠绳） -->
  <rect x="24" y="19.4" width="14" height="5.2" rx="1.2" fill="#5a200e"/>
  <path d="M26 19.6 L29 24.4 M30 19.6 L33 24.4 M34 19.6 L37 24.4" stroke="#c04020" stroke-width="1"/>

  <!-- 剑首 -->
  <circle cx="21.6" cy="22" r="3.4" fill="url(#gold)" stroke="#6a3c10" stroke-width=".6"/>
  <circle cx="21.6" cy="22" r="1.4" fill="#fff3d6"/>

  <!-- 剑格（云头格） -->
  <path d="M40 13.5 C 36.5 17, 36.5 27, 40 30.5 L 45.5 28.5 C 42.5 24.5, 42.5 19.5, 45.5 15.5 Z" fill="url(#gold)" stroke="#8a5a1a" stroke-width=".7"/>
  <path d="M41.8 19.8 L 44.2 22 L 41.8 24.2 L 39.4 22 Z" fill="#fff3d6" stroke="#c8862a" stroke-width=".5"/>

  <!-- 剑身（双刃八面体，中脊起棱） -->
  <path d="M45 15.2 C 43.4 19.5, 43.4 24.5, 45 28.8 L 118 20.4 L 140 22 L 118 23.6 Z" fill="url(#blade)"/>
  <!-- 血槽（中脊） -->
  <path d="M50 22 L 132 22" stroke="#ffffff" stroke-width="1.1" opacity=".78"/>
  <path d="M50 23.6 L 124 23.3" stroke="#b06414" stroke-width=".8" opacity=".45"/>
  <!-- 刃口高光 -->
  <path d="M47 16.1 L 120 20.1" stroke="#ffffff" stroke-width=".9" opacity=".92"/>
  <path d="M47 27.9 L 120 23.9" stroke="#ffffff" stroke-width=".9" opacity=".92"/>
  <!-- 剑身铭纹 -->
  <path d="M56 21 l1.6 1.6 1.6-1.6 -1.6-1.6 Z M64 21 l1.6 1.6 1.6-1.6 -1.6-1.6 Z" fill="#fff8dc" opacity=".55"/>

  <!-- 剑尖星芒 -->
  <path d="M140 14.5 L140 29.5 M132.5 22 L147.5 22" stroke="#ffffff" stroke-width="1" opacity=".9" stroke-linecap="round"/>
  <circle cx="140" cy="22" r="2.2" fill="#ffffff" opacity=".95"/>
</svg>
