<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 12">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d8fd9" stop-opacity=".2"/>
      <stop offset=".30" stop-color="#7fd8ff"/>
      <stop offset=".62" stop-color="#d8f4ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 寒气光晕 -->
  <ellipse cx="16" cy="6" rx="17" ry="6" fill="url(#aura)"/>

  <!-- 霜雾尾迹（三粒渐散雪晶） -->
  <circle cx="2"  cy="4" r="1.1" fill="#bfe8ff" opacity=".45"/>
  <circle cx="4.5" cy="7.5" r="0.9" fill="#d8f4ff" opacity=".6"/>
  <circle cx="6.5" cy="3" r="0.7" fill="#ffffff" opacity=".7"/>
  <line x1="1" y1="6" x2="7" y2="6" stroke="#9fdcff" stroke-width="1" opacity=".35" stroke-linecap="round"/>

  <!-- 侧枝小冰棱（雪花枝意象，上二下一） -->
  <path d="M12 4.4 L10.2 2.6 M16 4.8 L15 2.4 M14 7.6 L12.6 9.4" stroke="#bfe8ff" stroke-width="1" stroke-linecap="round" opacity=".8"/>

  <!-- 主冰棱（锐利三棱锥弹体） -->
  <path d="M8 4.9 C 7.2 5.5, 7.2 6.5, 8 7.1 L 22 5.6 L 34 6 L 22 6.4 Z" fill="url(#ice)"/>
  <!-- 棱面折光 -->
  <path d="M10 5.5 L 30 5.9" stroke="url(#facet)" stroke-width=".8" opacity=".9"/>
  <path d="M10.5 6.6 L 26 6.25" stroke="#ffffff" stroke-width=".5" opacity=".5"/>
</svg>
