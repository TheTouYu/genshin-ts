<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>五机体素材对照表——哪只是蓝兔？</title>
<style>body{background:#12122a;color:#eee;font-family:system-ui;padding:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{border:1px solid #445;padding:8px;text-align:center;background:#1a1a3a;border-radius:8px}
.card img{max-width:100%;height:110px;object-fit:contain;image-rendering:auto}
.tag{font-size:12px;color:#9ab;margin:4px 0}.big{font-size:15px;color:#ffd23f;font-weight:bold}
p{max-width:900px;line-height:1.6}</p></style></head>
<body>
<h2>五机体主体 shape 对照（原版 DefineSprite 展开）</h2>
<p>每列一个机体（fj0~fj4），列内是该机体主体精灵展开出的全部 shape。请告诉我：<b>哪一列/哪个编号是「蓝兔」</b>（顺带确认 fj 列 551 是否虹猫）。地址栏保持在本页，回复编号即可。</p>
<div class="grid" id="g"></div>
<script>
const data = {
 'fj (xr0·wzd·ps70)': [551,553,397],
 'fj1 (xr1·ldzd·ps65)': [568,570,402],
 'fj2 (xr2·jezd)': [603,405,605],
 'fj3 (xr3·ljzd)': [588,589,590,591,408,593,595],
 'fj4 (xr4·kzd·ps60)': [411,580,582],
};
const g = document.getElementById('g');
for (const [name, ids] of Object.entries(data)) {
  const d = document.createElement('div'); d.className='card';
  d.innerHTML = `<div class="big">${name}</div>` + ids.map(i =>
    `<div class="tag">#${i}</div><img src="../research/extract/assets/shapes/${i}.svg" onerror="this.replaceWith('(缺 ${i})')">`).join('');
  g.appendChild(d);
}
</script></body></html>
