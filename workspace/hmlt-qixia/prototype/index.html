<script>
'use strict';
/* ============================================================
 * 虹猫蓝兔七侠传 千星复刻 HTML demo（步骤3）
 * 逻辑坐标 = 千星系：原点左下、Y 向上、场地 444×250（GDD 宽屏重标定）。
 * 渲染层才做 y_html = FIELD_H - y 翻转；速度全部 px/秒（原版 px/帧 ×25）。
 * 素材 = FFDec 提取的原版 shape SVG，路径相对 research/extract。
 * ============================================================ */
const FIELD_W = 444, FIELD_H = 250;
const SVG = id => `../research/extract/assets/shapes/${id}.svg`;
// shape id → [文件id, 显示宽, 显示高]（显示尺寸来自白皮书或按 bounding box 缩放）
const ART = {
  hongmao:[551,34,36], lantu:[603,36,29], flame:[556,12,13],
  wingA:['assets/fudaiji-new.svg',20,15], wingB:[541,22,25],  // 僚机：虹猫剑形随行符(重绘) / 蓝兔 jedfdj(541)
  wzd:[610,19,6], jezd:[618,26,6], fdzd:[504,12,5], // 玩家弹（蓝兔=fj2 激光弹 jezd；fdzd=504，508 是嵌套精灵）
  changhong:['assets/changhong.svg',36,11],        // 长虹剑·手绘飞剑（② 用户裁决：复用弃，手绘方向）
  szd:[490,10,7], szd2:[496,8,8],                   // 敌弹：瞄准弹 / boss 弹
  dj1:[389,42,18], dj2:[357,38,39], dj3:[345,46,20], dj4:[321,34,33],
  boss1:[300,91,112],                               // 白皮书 §3: boss1 91×112
  phoenix:[510,46,52],                              // ldfhm 雷电凤凰
  bingpoj:[518,46,16],                              // 冰魄剑（jedfhm→519→shape518）
  die:[402,64,64],                                  // die1 真身（大爆炸，boss 死亡）
  pow:[414,18,7], bom1:[422,18,7], bs:[337,16,16], shield:[499,45,45],
  boom:[402,56,40], bg:[434,1333,250],              // 背景 1493×280 → 高250 等比
  bg2:[446,1486,250],                                  // 关2 背景 cj2(447→446)

  jbfjg:[179,132,91], boss2:[49,80,86], boss2b:[48,60,140],             // 中boss/尾boss P1/P2
  guanri:['assets/guanri.svg',444,48], huofeng:['assets/huofeng.svg',74,58],

  suibing:['assets/suibing.svg',16,16],
};
const imgs = {}; let imgsLeft = 0, imgTimer = null;
for (const k in ART) { imgsLeft++; const im = new Image();
  im.onload = im.onerror = () => imgsLeft--;
  im.src = (typeof ART[k][0]==='string') ? ART[k][0] : SVG(ART[k][0]); imgs[k] = im; }
const drawArt = (ctx,k,x,y,w,h,rot)=>{ const im=imgs[k]; if(!im.complete||!im.naturalWidth) return;
  ctx.save(); ctx.translate(x, FIELD_H-y); if(rot) ctx.rotate(rot);
  ctx.drawImage(im, -(w||ART[k][1])/2, -(h||ART[k][2])/2, w||ART[k][1], h||ART[k][2]); ctx.restore(); };

// ---------- 数值总表（白皮书 §7，px/帧 → px/s ×25） ----------
const N = {
  player: {vx:175, vy:100, xMin:25, xMax:415, yMin:34, yMax:220},  // ±7/±4px 帧，宽屏 xMax 373→415
  zdlv:[16,16,13,15,14],               // v11 基础攻击力上调（用户：关1偏难）
  ps:{hongmao:70, lantu:65},           // 蓄能阈值
  chargeRate:25,                       // neng++/帧
  ships:{
    hongmao:{bullet:'changhong', bspeed:420, fireCd:0.7, dmgMul:4.3, ps:70, wing:'wingA', wingBullet:'fdzd', wingSpeed:700, bombName:'普通爆', sfx:'fire',  chargeType:'guanri',  bombDj:50, bombBoss:50},  // ③ 虹猫蓄力=长虹贯日（僚机灌注）
    lantu:  {bullet:'jezd',bspeed:620, fireCd:0.4, dmgMul:2.1, ps:65, wing:'wingB', wingBullet:'jezd', wingSpeed:700, bombName:'激光爆', sfx:'fireL', chargeType:'sword', bombDj:30, bombBoss:30}, // 蓝兔冰魄剑（三把穿透飞刀）
  },
  enemy:{ dj1:{hp:1, spd:250, score:10}, dj2:{hp:250, zdsd:150, score:300},   // round1 口径（报告§4）：dj2=250/dj4=100
          dj3:{hp:500, zdsd:150, score:300}, dj4:{hp:100, zdsd:137, score:300},
          nq:{hp:150, zdsd:125, score:300, w:24,h:24, drop:'bs2'},
          lsfj:{hp:150, zdsd:150, score:200, w:26,h:36, drop:'bs1'},
          jbdj:{hp:300, zdsd:125, score:500, w:52,h:36, drop:'jbdj'},
          lfj:{hp:1, score:15, w:30,h:12},
          jbfjg:{hp:1700, zdsd:175, score:2000, w:104,h:64, drop:'jbfjg'},
          boss1:{hp:3000, zdsd:150, score:1000},
          boss2:{hp:4000, zdsd:150, score:1500} },
  bombDmg:50, phoenixDps:50, scroll:100, scrollBoss:175, bsHpMax:8,
};
const wavesDef = [ // 关1（白皮书 §3 导演 381）：dj3×1→dj4×2→dj3×2→dj2×1×4→dj4→boss1
  // 出生 y=千星系(左下原点)；带内 [70,190] 保证玩家可达（教训：勿照抄 Flash 顶左 y）
  {spawns:[['dj3',130]]}, {spawns:[['dj4',95],['dj4',60]]}, {spawns:[['dj3',130],['dj3',45]]},
  {spawns:[['dj2',90]]}, {spawns:[['dj2',140]]}, {spawns:[['dj2',50]]}, {spawns:[['dj2',80]]},
  {spawns:[['dj4',70]]}, {boss:'boss1'},
];
const wavesDef2 = [ // 关2（导演 249 纯时间表；t=帧/25，y=250-Flash顶左y；中boss/尾boss 击杀后续表）
  {t:0.8, spawns:[['nq',170],['nq',130]]},
  {t:2.3, spawns:[['dj3',60]]},
  {t:4.1, spawns:[['dj4',190],['dj4',130],['dj4',60]]},
  {t:5.3, spawns:[['nq',150],['nq',60]]},
  {t:7.5, spawns:[['nq',200],['nq',130]]},
  {t:9.0, spawns:[['nq',140],['nq',80]]},
  {t:9.8, spawns:[['dj3',140]]},
  {t:11.2, spawns:[['jbdj',180]]}, {t:11.6, spawns:[['jbdj',140]]}, {t:12.0, spawns:[['jbdj',80]]},
  {t:12.4, spawns:[['nq',200],['nq',50]]}, {t:12.7, spawns:[['nq',150],['nq',100]]},
  {t:13.6, midBoss:'jbfjg'},                       // f327-328 bos 门闩
  {t:14.4, spawns:[['lsfj',200],['lsfj',150]]}, {t:15.6, spawns:[['lsfj',100]]},
  {t:16.8, spawns:[['lsfj',200],['lsfj',70]]}, {t:18.0, spawns:[['dj3',120]]},
  {t:19.4, boss:'boss2'},                          // f384 dong=2 前奏 + f419 bjsd 7 提速
];
const LEVELS = [
  {name:'第一关 · 长虹出鞘', bg:'bg',  waves:wavesDef,  mode:'gate'},
  {name:'第二关 · 冰魄试炼', bg:'bg2', waves:wavesDef2, mode:'time', env:'lfj'},
];
// ---------- ⑤ 领悟图鉴（用户设计：初始只显名字，触发后解锁详情；纯展示无 buff） ----------
const CODEX = [
  ['guanri_full','满编贯日','僚机≥3 时蓄力释放长虹贯日','剑气宽度=基础18+15×僚机数，满编≈2.6倍'],
  ['jiejian','贯日接剑','贯日释放后 0.5 秒内接射','释放后普攻冷却清零，立即再射'],
  ['rifeng','日凤连环','火凤命中已点燃的目标','对点燃目标伤害 ×1.5'],
  ['xuli_zouwei','蓄力走位','一次蓄力期间贴身躲过 3 发敌弹','无伤蓄满=全额回报'],
  ['jian_bu_zhen','剑哺针','冰魄剑一次命中 2 个以上敌人','每命中 1 敌回收 1 根银针'],
  ['dong_sui','冻→碎','冰魄剑命中被冰封千里冻结的目标','伤害 ×2 并碎冰'],
  ['bing_lun','冰轮舞','10 秒内完成 射→蓄→剑→针墙 全环','蓝兔循环引擎，输出上限的来源'],
  ['yi_xian_chuan','一线穿','一根银针穿透 3 个以上敌人','银针穿透特性'],
  ['tie_lian','贴脸斩','在极近距离（≤40px）击杀敌人','近距命中密度最高'],
  ['man_zhen','满针预瞄','一轮针墙命中 5 个以上敌人','满针时机=敌群密度峰值'],
];
let codexUnlocked = {};
try{ codexUnlocked = JSON.parse(localStorage.getItem('hmlt-codex')||'{}'); }catch(e){}

// ---------- 输入 ----------
// 键盘=物理键位映射（e.code）：与布局（Colemak/QWERTY）和输入法（拼音 IME）无关——
// 键帽印 D 就右移、印 J 就开枪。实测教训：布局字母通道在 Colemak+IME 下必然错乱。
function normKey(e){
  const m = e.code && /^Key([A-Z])$/.exec(e.code);
  if(m) return m[1].toLowerCase();   // 物理位字母（KeyD→'d'）
  return e.key.toLowerCase();        // 方向键/回车等
}
const keys = {}; let jEdge=false, kEdge=false;
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  const k = normKey(e);
  if(!keys[k]){ if(k==='j') jEdge=true; if(k==='k') kEdge=true; }
  keys[k]=true;
  if(game && game.state!=='select'){ if(k>='1'&&k<='5') game.setLv(+k); if(k==='b') game.addBomb(); if(k==='p') game.dropPowAtPlayer();
    if(k==='m'){ SFX.mode=SFX.mode==='classic'?'full':'classic'; game.say('音效:'+(SFX.mode==='classic'?'原版3音':'完整(再创)')); } }
  if(k==='r' && game && game.state!=='select') restart();
  if(k==='c') toggleCodex();
});
addEventListener('keyup', e=>keys[normKey(e)]=false);

// ---------- 音效（原版 DefineSound 导出 mp3；具名 4 个实证，数字 id 为占位可换） ----------
const SFX = { ctx:null, buf:{}, last:{}, mode:'full', // classic=原版仅 3 音（up/wudao/cjb），M 键切 full 再创音效
  map:{ fire:'573.mp3', fireL:'560.mp3', boomE:'4_boom.mp3', boomP:'3_aida.mp3', pow:'1_up.mp3',
        bomb:'295.mp3', phoenix:'982.mp3', bs:'5_cjb.mp3', sel:'1_up.mp3', boss:'694.mp3', wudao:'2_wudao.mp3', full:'529.mp3', hit:'473.mp3' },
  init(){ if(this.ctx){ this.ctx.resume && this.ctx.resume(); return; }
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    for(const [k,f] of Object.entries(this.map)){
      fetch('../research/extract/assets/sounds/'+f).then(r=>r.arrayBuffer())
        .then(b=>this.ctx.decodeAudioData(b)).then(d=>this.buf[k]=d).catch(()=>{}); } },
  play(k, gain=0.35, thr=80){ if(this.mode!=='full' && !['pow','bs','wudao'].includes(k)) return; if(!this.ctx || !this.buf[k]) return;
    const now=performance.now(); if(this.last[k] && now-this.last[k]<thr) return; this.last[k]=now;
    const s=this.ctx.createBufferSource(); s.buffer=this.buf[k];
    const g=this.ctx.createGain(); g.gain.value=gain;
    s.connect(g); g.connect(this.ctx.destination); s.start(); } };
addEventListener('keydown', ()=>SFX.init());
addEventListener('pointerdown', ()=>SFX.init());
// 触屏：拖动移动 + 自动开火 + 炸弹按钮
let touch={on:false,x:0,y:0};
const cv=document.getElementById('cv');
function canvasPos(ev){ const r=cv.getBoundingClientRect();
  const px=(ev.clientX-r.left)/r.width*FIELD_W, py=(ev.clientY-r.top)/r.height*FIELD_H;
  return {x:px, y:FIELD_H-py}; }
cv.addEventListener('pointerdown', ev=>{ ev.preventDefault();
  const p=canvasPos(ev);
  if(game&&game.state==='select'){ game.selectClick(p); return; }
  touch.on=true; touch.x=p.x; touch.y=p.y; });
cv.addEventListener('pointermove', ev=>{ if(!touch.on)return; const p=canvasPos(ev); touch.x=p.x; touch.y=p.y; });
addEventListener('pointerup', ()=>touch.on=false);

// ---------- 工具 ----------
const dmgBig=b=>b.pierce||b.dmg>=50;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hit=(a,b)=>Math.abs(a.x-b.x)*2<a.w+b.w && Math.abs(a.y-b.y)*2<a.h+b.h;
const aimed=(x,y,tx,ty,sp)=>{ const dx=tx-x, dy=ty-y, L=Math.hypot(dx,dy)||1; return {vx:dx/L*sp, vy:dy/L*sp}; };

// ---------- 游戏主类 ----------
class Game{
  constructor(){ this.reset(); }
  reset(){
    this.state='select'; this.selIdx=0; this.t=0;
    this.score=0; this.life=4; this.bomm=3; this.lv=1; this.neng=0;
    this.ship=null; this.bullets=[]; this.ebullets=[]; this.enemies=[]; this.items=[]; this.booms=[];
    this.wings=[]; this.phoenix=null; this.shield=0; this.wave=-1; this.waveGap=0; this.boss=null;
    this.wingBurst=0; this.bombFx=null; this.flashT=0; this.flyIn=false; this.fashez=0;
    this.levelIdx=0; this.levelT=0; this.mode='gate'; this.envTimer=1.5; this.env=null;
    this.stats={kills:0,hits:0,pick:0,time:0};
    this.needles=0; this.shotN=0; this.wallSeq=0; this.wallHits={};
    this.guanri=null; this.phoenix2=null; this.freezeT=0; this.jieJian=0; this.chargeGraze=0;
    this.loopMark={shot:-99,sword:-99,wall:-99}; this.bgKey='bg'; this.unlockFx=null; this.slowT=0; this.slowK=0.35;
    this.shake=0; this.tintFx=null; this.winPending=0; this.wingBurst2=0;
    this.scrollX=0; this.scrollSpd=N.scroll; this.dj1Timer=1.5; this.invuln=0; this.lock=0;
    this.msg=null; this.msgT=0; this.bgW=ART.bg[1];
  }
  startRun(){
    this.state='playing'; this.shipKey=this.selIdx?'lantu':'hongmao';
    this.ship={x:45,y:100,w:10,h:8}; this.fireCd=0; this.neng=0; this.burst=0; this.burstCd=0;
    this.loadLevel(0); this.stats={kills:0,hits:0,pick:0,time:0};
    this.items.push(this.mkItem('pow',130,110)); // 原版 one frame_1 开局白送 1 个 pow（入场即升 lv2 节奏钩子）
    this.log('game_start'); this.log('char_select '+this.shipKey); SFX.play('sel');
    document.getElementById('bombBtn').style.display='block';
  }
  loadLevel(i){ // ④ 跨关继承：lv/bomm/life/score 保留；银针/蓄能清零
    this.levelIdx=i; const L=LEVELS[i];
    this.waves=L.waves; this.mode=L.mode; this.env=L.env||null;
    this.wave=-1; this.levelT=0; this.waveGap=0; this.boss=null;
    this.enemies.length=0; this.ebullets.length=0; this.items.length=0; this.booms.length=0;
    this.needles=0; this.neng=0; this.guanri=null; this.phoenix2=null; this.freezeT=0;
    this.scrollSpd=N.scroll; this.envTimer=1.5; this.bgKey=L.bg; this.bgW=ART[L.bg][1];
    this.say(L.name); this.log('level '+(i+1)); }
  unlock(id){ if(codexUnlocked[id]) return; codexUnlocked[id]=1;   // ⑤ 悟·一次性
    try{ localStorage.setItem('hmlt-codex',JSON.stringify(codexUnlocked)); }catch(e){}
    const e=CODEX.find(c=>c[0]===id); this.unlockFx={t:2.5,n:e[1]}; this.slowT=0.5; this.slowK=0.35; SFX.play('full'); this.log('insight '+id); }
  log(s){ if(game===this) console.log('[hmlt]',s); } // 与 tests-trace.md 词汇表对齐
  say(s){ this.msg=s; this.msgT=1.6; }
  setLv(n){ this.lv=clamp(n,1,5); this.syncWings(); this.neng=0; this.say('武器 LV'+this.lv+(this.lv>1?' · 按住J蓄力，满后松手释放':'')); }
  fireVolley(){ const S=this.ship, cfg=N.ships[this.shipKey];
    const dmg=Math.round(N.zdlv[this.lv-1]*(cfg.dmgMul||1)), sp=cfg.bspeed; // ① ×1.8/×0.9 分角色
    const bw=cfg.bullet==='jezd'?24+this.lv*2:cfg.bullet==='changhong'?28:27,
          bh=cfg.bullet==='jezd'?8:cfg.bullet==='changhong'?9:[10,15,12,15,15][this.lv-1]; // 碰撞盒略小于视觉（原版 aaaa 口径）
    const fan=cfg.bullet==='changhong'; // v11：虹猫升 lv 出扇形、蓝兔加纵距（取消光晕）
    const offs=fan
      ? (this.lv<=2?[[0,0]]:this.lv===3?[[0,-50],[0,50]]:this.lv===4?[[0,-70],[0,0],[0,70]]:[[0,-90],[0,-45],[0,0],[0,45],[0,90]])
      : (this.lv<=2?[[0,0]]:this.lv===3?[[-4,0],[4,0]]:this.lv===4?[[-8,0],[8,0]]:[[-12,0],[-4,0],[4,0],[12,0]]); // 蓝兔直线纵排
    const aw=cfg.bullet==='changhong'?36:bw, ah=cfg.bullet==='changhong'?11:bh; // 视觉尺寸（飞剑大弹）
    for(const [oy,vy] of offs) this.bullets.push({x:S.x+16,y:S.y+oy,vx:sp,vy,w:bw,h:bh,aw,ah,dmg,art:cfg.bullet});
    SFX.play(cfg.sfx||'fire',0.18); this.log('fire');
    this.loopMark.shot=this.t;
    if(this.jieJian>0){ this.jieJian=0; this.unlock('jiejian'); }   // 悟二·贯日接剑
    if(this.shipKey==='hongmao'){ // v12：僚机跟随本体同步齐射（每拍可见）
      for(const w of this.wings){ this.bullets.push({x:w.x+10,y:w.y,vx:w.bspd||cfg.wingSpeed,vy:0,
        w:16,h:7,dmg:Math.round(N.zdlv[this.lv-1]*1.2),art:cfg.wingBullet});
        this.booms.push({x:w.x+13,y:w.y,t:.08,spark:true}); } }
    else if(this.needles<this.lv*(2+this.lv)) this.needles++; // v12：每发+1针，容量=lv×(2+lv)=3~35
  }
  releaseCharge(){ const cfg=N.ships[this.shipKey], S=this.ship;
    this.fashez=2.0; this.log('phoenix '+this.lv); SFX.play('phoenix',0.5);
    if(cfg.chargeType==='guanri'){ // v12 长虹贯日：巨剑前推扫场（随lv更大更深）+僚机S阵列
      const n=this.wings.length;
      this.guanri={t:1.4,x:S.x+20,w:64+22*this.lv+18*n,y:S.y,dmg:60+35*this.lv,hit:new Set()};
      if(n>=3) this.unlock('guanri_full');
      this.wingBurst2=1.2;                                       // 每僚机 5+lv 发 S 形正弦弹
      this.jieJian=0.5; this.say('长虹贯日!'); return; }
    else { // v12 蓝兔蓄力=冰魄剑（高单体·不穿透·被小怪挡=需先清场）+银针齐发（范围·列序）
      const tgt=this.enemies.filter(e=>!e.dead&&e.x>S.x).sort((a,b)=>a.x-b.x)[0];
      const ang=clamp(tgt?Math.atan2(tgt.y-S.y,tgt.x-S.x):0,-0.5,0.5);
      for(let k=0;k<this.lv;k++){ const a=ang+(k-(this.lv-1)/2)*0.14;   // 把数=lv，大小/伤害随 lv
        this.bullets.push({x:S.x+16,y:S.y,vx:Math.cos(a)*750,vy:Math.sin(a)*750,w:40,h:24,
          aw:46+6*this.lv,ah:14+2*this.lv,dmg:50+30*this.lv,maxD:200,dist:0,art:'bingpoj'}); }
      this.say('冰魄剑!'); this.loopMark.sword=this.t;
      this.needleBarrage(); } }
  needleBarrage(){ const S=this.ship, n=this.needles, rows=this.lv, per=2+this.lv;
    if(n===0) return;
    // v12 列序齐发：从右到左、列内从上到下（伤害总时长拉长+位置预判；发射后不跟随玩家）
    for(let i=0;i<n;i++){ const row=Math.floor(i/per), col=i%per;
      setTimeout(()=>{ if(game!==this||this.state!=='playing') return;
        this.bullets.push({x:S.x-10,y:S.y+(row-(rows-1)/2)*11,vx:560,vy:(row-(rows-1)/2)*18,
          w:30,h:9,aw:44+5*this.lv,ah:10+this.lv,dmg:12+7*this.lv,
          pierce:true,art:'yinzhen',wallId:++this.wallSeq});
        SFX.play('fireL',0.2); }, ((per-1-col)*rows+row)*70); }
    this.needles=0; this.say('冰魄银针·齐发!'); this.log('needle_wall');
    this.loopMark.wall=this.t;
    if(this.t-this.loopMark.shot<12) this.unlock('bing_lun'); }
  addBomb(){ this.bomm=Math.min(this.bomm+1,7); this.say('调试: 宝='+this.bomm); }
  dropPowAtPlayer(){ this.items.push(this.mkItem('pow',this.ship.x+60,this.ship.y)); }
  syncWings(){ // 僚机 = lv-1 个（死亡 lv=1 全散；白皮书 §2.3）
    const want=this.lv-1;
    while(this.wings.length<want) this.wings.push({x:this.ship.x-20,y:this.ship.y,fireCd:0,
      bspd:250+Math.random()*100, k:0.6+Math.random()*0.8}); // 原版 zdsd=r(5)+10 / sd=r(10)+5 个体随机
    while(this.wings.length>want) this.wings.pop();
  }
  mkItem(kind,x,y){ return {kind,x,y,w:kind==='bs'?16:20,h:kind==='bs'?16:12,vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,life:kind==='bs'?10:4,
    tx:20+Math.random()*350, ty:20+Math.random()*200}; }
  tryBomb(){
    if(this.state!=='playing'||this.lock>0||this.bomm<=0) return;
    this.bomm--; this.shield=2.0; this.log('bomb '+this.bomm); this.flashT=0.4;
    this.slowT=0.5; this.slowK=0.08; this.shake=0.7;        // v12 造势：时停+画面震动
    this.tintFx={t:1.3, c:this.shipKey==='hongmao'?'255,110,30':'110,190,255'};
    SFX.play(this.shipKey==='hongmao'?'phoenix':'boss', this.shipKey==='hongmao'?0.5:0.35);
    if(this.shipKey==='hongmao'){ // ③ 火凤燎原：火凤掠场，接触点燃+持续伤害（对点燃×1.5）
      this.phoenix2={x:this.ship.x+20,y:this.ship.y,vx:240,t:5,hit:new Set()}; // v11 更久更慢=看清楚
      this.ebullets.length=0; this.say('火凤燎原!'); }
    else { // ③ 冰封千里：全屏冻结敌弹+敌机减速 3s（控场型，冻→碎 ×2 钩子）
      this.freezeT=4; this.say('冰封千里!'); // v11 4s+完全冻结
      for(const b of this.ebullets){ b.vx=0; b.vy=0; b.frozen=true; } }
  }
  damage(e,dmg,isBomb){ e.hp-=dmg; e.flash=0.09; // 受击白闪反馈
    if(e.hp<=0 && !e.dead){ e.dead=true; this.onKill(e); } }
  onKill(e){
    this.score+=e.def.score; this.stats.kills++; this.log('score '+this.score);
    SFX.play(e.kind==='bsx'?'bs':'boomE');
    this.booms.push({x:e.x,y:e.y,t:0.5,big:e.isBoss});
    if(this.ship&&Math.hypot(e.x-this.ship.x,e.y-this.ship.y)<40) this.unlock('tie_lian'); // 悟九·贴脸斩
    if(e.kind==='dj3'||e.isBoss||e.isMid){ this.items.push(this.mkItem('pow',e.x,e.y)); this.say('能量块出现!'); }
    if(e.kind==='dj2'){ this.items.push(this.mkItem('bs',e.x,e.y),this.mkItem('bs',e.x,e.y)); }
    if(e.kind==='dj4'&&Math.random()<.5) this.items.push(this.mkItem('bs',e.x,e.y));
    if(e.kind==='nq') this.items.push(this.mkItem('bs',e.x,e.y),this.mkItem('bs',e.x,e.y));      // nq f18 掉 bs×2
    if(e.kind==='lsfj') this.items.push(this.mkItem('bs',e.x,e.y));
    if(e.kind==='jbdj'){ if(Math.random()<.3) this.items.push(this.mkItem('pow',e.x,e.y));      // f16 diao<3→pow 30%
      else for(let i=0;i<3;i++) this.items.push(this.mkItem('bs',e.x,e.y)); }
    if(e.isMid) this.items.push(this.mkItem('bom1',e.x,e.y));                                    // jbfjg: bom1+pow
    if(e.isBoss){ const nb=e.kind==='boss2'?6:5;                       // v12：boss 爆升级道具+大招点，6s 拾取缓冲
      for(let i=0;i<nb;i++){ const it=this.mkItem('bs',e.x,e.y); it.vx=(Math.random()-.5)*160; it.vy=(Math.random()-.5)*120; it.free=true; it.life=9; this.items.push(it); }
      const pw=this.mkItem('pow',e.x-24,e.y+12); pw.life=9; this.items.push(pw);
      const bm=this.mkItem('bom1',e.x+24,e.y+12); bm.life=9; this.items.push(bm);
      this.winPending=6; return; }
  }
  win(){ // v12 过关结算卡片
    this.state='clear'; this.log('level_clear');
    const st=this.stats, r=st.hits===0?'甲':st.hits<=2?'乙':'丙';
    const last=this.levelIdx>=LEVELS.length-1;
    this.showResult(`<div class="card"><h1>${LEVELS[this.levelIdx].name}</h1>
      <div class="sub">通 关</div>
      <div class="grid">
        <div class="st"><b>${st.kills}</b><span>击破</span></div>
        <div class="st"><b>${st.hits}</b><span>受击</span></div>
        <div class="st"><b>${st.time|0}s</b><span>用时</span></div>
        <div class="st"><b>${st.pick}</b><span>拾取</span></div></div>
      <div class="badge b${r}">${r}</div>
      <div class="rw">奖励：+1 命 · 宝回满（当前 命${Math.min(this.life+1,9)} 宝3）</div>
      <button onclick="game.nextLevel()">${last?'再来一轮 (R)':'下一关 (J)'}</button>
      ${last?'<div class="rw" style="margin-top:10px">两关全破（2/6）· 总分 '+this.score+' · 关 3-6 等你反馈</div>':''}</div>`); }
  nextLevel(){ this.hideResult();
    if(this.levelIdx>=LEVELS.length-1){ this.state='win'; this.log('game_win'); restart(); return; }
    this.life=Math.min(this.life+1,9); this.bomm=3;               // ④ 过关奖励：+1 命·宝回满
    this.loadLevel(this.levelIdx+1); this.state='playing'; }
  fail(){ this.state='fail'; this.log('fail life');
    this.showResult(`<div class="card"><h1 style="color:#e05a5a">任务失败</h1>
      <div class="sub">得分 ${this.score}</div>
      <div class="rw">从关 1 重来（街机 run）</div>
      <button onclick="restart()">重开 (R)</button></div>`); }
  showResult(html){ const r=document.getElementById('result');
    r.innerHTML=html; r.style.display='flex'; SFX.play('wudao',0.4);
    document.getElementById('bombBtn').style.display='none'; }
  hideResult(){ document.getElementById('result').style.display='none';
    document.getElementById('panel').style.display='none'; }
  showPanel(t,s){ const p=document.getElementById('panel');
    document.getElementById('panelTitle').textContent=t;
    document.getElementById('panelSub').textContent=s; p.style.display='flex'; SFX.play('wudao',0.4);
    document.getElementById('bombBtn').style.display='none'; }
  selectClick(p){ // 点左侧选虹猫，右侧选蓝兔
    this.selIdx = p.x>FIELD_W/2?1:0; this.startRun(); }

  spawnWave(){
    this.wave++;
    if(this.wave>=this.waves.length) return;
    const w=this.waves[this.wave];
    if(w.boss){ const def=N.enemy[w.boss];
      this.boss={kind:w.boss,def,hp:def.hp,x:FIELD_W+70,y:w.boss==='boss2'?135:150,w:80,h:100,
        isBoss:true,phase:'enter',pt:0,patT:0,pat:0,phase2:false,win18:0,winT:0,dead:false};
      this.scrollSpd=N.scrollBoss; this.lock=1.0; this.ebullets.length=0; this.log('boss_spawn'); SFX.play('boss',0.5); return; }
    if(w.midBoss){ const def=N.enemy.jbfjg; // 关2 中boss 金鞭飞蛟（bos 门闩：击杀后续表）
      this.enemies.push({kind:'jbfjg',def,hp:def.hp,x:FIELD_W+40,y:200,w:def.w,h:def.h,t:0,fireT:1.2,dead:false,
        isMid:true,hoverX:345,bob:0}); this.log('midboss'); SFX.play('boss',0.45); return; }
    for(const [kind,y] of w.spawns){
      const def=N.enemy[kind];
      this.enemies.push({kind,def,hp:def.hp,x:FIELD_W+30,y,w:def.w||30,h:def.h||22,t:0,fireT:1+Math.random(),dead:false,
        hoverX:320+Math.random()*60, bob:Math.random()*6.28});
    }
    this.log('wave '+(this.wave+1));
  }

  update(dt){
    this.t+=dt; this.stats.time+=dt; if(this.msgT>0) this.msgT-=dt;
    if(this.state==='select'){ if(jEdge||keys['enter']) this.startRun();
      if(keys['a']||keys['arrowleft']) this.selIdx=0; if(keys['d']||keys['arrowright']) this.selIdx=1;
      return; }
    if(this.state==='clear'&&(jEdge||kEdge)){ this.nextLevel(); return; }
    if(this.state!=='playing') return;
    if(this.slowT>0){ this.slowT-=dt; dt*=this.slowK||0.35; } // 悟/大招·顿帧（时停）
    if(this.winPending>0){ this.winPending-=dt; if(this.winPending<=0&&this.state==='playing') this.win(); } // boss 掉落拾取缓冲
    const S=this.ship, cfg=N.ships[this.shipKey];
    if(this.lock>0){ this.lock-=dt; }
    if(this.flyIn){ this.ship.x+=280*dt; if(this.ship.x>=40){ this.ship.x=40; this.flyIn=false; } }
    if(this.invuln>0) this.invuln-=dt;
    if(this.shield>0) this.shield-=dt;
    if(this.freezeT>0){ this.freezeT-=dt; if(this.freezeT<=0) for(const b of this.ebullets) if(b.frozen) b.x=1e4; } // 冰晶碎散
    if(this.shake>0) this.shake-=dt;
    if(this.tintFx){ this.tintFx.t-=dt; if(this.tintFx.t<=0) this.tintFx=null; }

    // 移动（WASD/方向键/触屏）
    let mvx=0,mvy=0;
    if(this.lock<=0){
      if(keys['a']||keys['arrowleft'])mvx-=1; if(keys['d']||keys['arrowright'])mvx+=1;
      if(keys['w']||keys['arrowup'])mvy+=1; if(keys['s']||keys['arrowdown'])mvy-=1;
      if(touch.on){ const dx=touch.x-S.x, dy=touch.y-S.y, L=Math.hypot(dx,dy);
        if(L>4){mvx=dx/L;mvy=dy/L;} }
    }
    S.x=clamp(S.x+mvx*N.player.vx*dt, N.player.xMin, N.player.xMax);
    S.y=clamp(S.y+mvy*N.player.vy*dt, N.player.yMin, N.player.yMax);
    if(mvx||mvy){ if(S.x===N.player.xMin)this.log('bound left'); if(S.x===N.player.xMax)this.log('bound right');
      if(S.y===N.player.yMin)this.log('bound down'); if(S.y===N.player.yMax)this.log('bound up'); }

    // 开枪（原版 D159 点射模型）：J 一按=一段 3 连点射（an 门闩锁到松手），长按无连发→转纯蓄力；触屏保留自动连发（再创偏差）
    const firing=keys['j']||touch.on;
    const wasCd=this.fireCd;
    this.fireCd-=dt;
    if(wasCd>0&&this.fireCd<=0&&this.state==='playing') this.readyFx=0.14; // 冷却完成=剑已出鞘节拍点
    if((jEdge||touch.on)&&this.lock<=0&&this.state==='playing'&&this.fireCd<=0){
      this.fireVolley(); this.fireCd=cfg.fireCd||0.3; } // v12：虹猫0.7重剑(≈69/发)/蓝兔0.4(≈34/发)
    if(this.readyFx>0) this.readyFx-=dt;
    if(this.jieJian>0) this.jieJian-=dt;   // 贯日接剑 0.5s 窗口衰减
    // 蓄力（原版结构 D157+D159）：首轮点射后长按=纯蓄力（惩罚期无额外攻击）；松手瞬间清零；
    // 蓄满后松手才释放角色专属分支（定时长自动攻击=回馈期）；fashez 释放窗口锁 50 帧（2s）内不可再蓄
    if(this.fashez>0){ this.fashez-=dt; this.neng=0; }
    else if(firing&&this.lv>1) this.neng=Math.min(this.neng+N.chargeRate*dt,cfg.ps);
    if(this.lv>1){ if(this.neng>=cfg.ps){ if(!this.chargeFull){ this.chargeFull=true; SFX.play('full');
        if(this.chargeGraze>=3) this.unlock('xuli_zouwei'); this.chargeGraze=0; } } else this.chargeFull=false; }
    if(this.neng<=0) this.chargeGraze=0;
    if(!firing&&this.neng>0){
      if(this.neng>=cfg.ps) this.releaseCharge(); // 满能松手=释放
      this.neng=0;
    }
    if(this.wingBurst>0) this.wingBurst-=dt;
    if(kEdge) this.tryBomb();
    if(this.phoenix){ const p=this.phoenix; p.t-=dt;
      if(!p.static){ const w0=this.wings[0]||{x:S.x,y:S.y};
        p.x+=(w0.x+20-p.x)*Math.min(1,dt*3); p.y+=(w0.y-p.y)*Math.min(1,dt*3); }
      if(p.t<=0) this.phoenix=null; }

    // 僚机：平时由 fireVolley 同步齐射；蓄力期=虹猫环绕灌注/蓝兔针座贴身；S 阵列窗
    const charging=this.lv>1&&this.neng>0&&this.fashez<=0;
    if(this.wingBurst2>0) this.wingBurst2-=dt;
    for(let i=0;i<this.wings.length;i++){ const w=this.wings[i]; let tx,ty;
      if(charging&&this.shipKey==='hongmao'){ const a=this.t*4+i*6.28/Math.max(1,this.wings.length);  // 环绕注能
        tx=S.x+Math.cos(a)*26; ty=S.y+Math.sin(a)*26; }
      else if(charging){ tx=S.x+22-i*10; ty=S.y+(i%2?6:-6); }                              // 蓝兔针座贴身
      else { tx=S.x-26-i*16; ty=S.y-10; }
      const k=Math.min(1,dt*5*(w.k||1));
      w.x+=(tx-w.x)*k*1.4; w.y+=(ty-w.y)*k;
      w.fireCd-=dt;
      if(this.wingBurst2>0&&w.fireCd<=0&&this.lock<=0){     // v12 S 阵列：正弦弹道扇海
        this.bullets.push({x:w.x+10,y:w.y,vx:520+Math.random()*160,vy:0,
          sine:{amp:55+Math.random()*35,freq:5+Math.random()*2,ph:Math.random()*6.28},
          w:14,h:6,dmg:Math.round(N.zdlv[this.lv-1]*0.9),art:'fdzd'});
        w.fireCd=1.2/(5+this.lv); } }

    // 卷轴
    if(this.bombFx){ this.bombFx.t-=dt; this.bombFx.tick-=dt;
      if(this.bombFx.tick<=0&&this.bombFx.tickN<4){ this.bombFx.tick=0.4; this.bombFx.tickN++;
        for(const e of this.enemies) this.damage(e,cfg.bombDj,true);   // 机体分档：虹猫50/蓝兔30
        if(this.boss) this.damage(this.boss,cfg.bombBoss,true); }
      if(this.bombFx.t<=0) this.bombFx=null; }
    if(this.flashT>0) this.flashT-=dt;
    this.scrollX+=this.scrollSpd*dt;

    // 环境刷怪器：关1=dj1(372) / 关2=lfj 蜻蜓(235, 5-7px/帧左漂)
    this.dj1Timer-=dt;
    if(this.dj1Timer<=0&&this.enemies.length+(this.boss?1:0)<14){ this.dj1Timer=0.12;
      if(Math.random()<0.1){ const y=40+Math.random()*150;
        if(this.env==='lfj') this.enemies.push({kind:'lfj',def:N.enemy.lfj,hp:1,x:FIELD_W+20,y,w:30,h:12,t:0,dead:false,
          spd:125+Math.random()*50, fired:false, fireT:99});
        else this.enemies.push({kind:'dj1',def:N.enemy.dj1,hp:1,x:FIELD_W+20,y,w:34,h:14,t:0,dead:false,
          spd:200+Math.random()*100, fired:false, fireT:99}); } }

    // 波次引擎：关1=击杀门闩(diren) / 关2=纯时间表(249 t 计数；boss/中boss 段冻结)
    this.waveGap-=dt;
    if(this.mode==='time'){ this.levelT+=dt;
      const bossHold=this.boss||this.enemies.some(e=>e.isMid);
      if(!bossHold) while(this.wave<this.waves.length-1&&this.waves[this.wave+1]&&this.waves[this.wave+1].t<=this.levelT) this.spawnWave();
    } else {
      const gateClear=this.enemies.filter(e=>e.kind!=='dj1'&&e.kind!=='lfj').length===0 && !this.boss;
      if(gateClear&&this.wave<this.waves.length-1&&this.waveGap<=0){ this.spawnWave(); this.waveGap=1.2; }
    }

    // 敌机更新
    for(const e of this.enemies){
      e.t+=dt*(this.freezeT>0?0:1); if(e.flash>0) e.flash-=dt;
      const fs=this.freezeT>0?0:1;                           // v11 冰封千里：完全冻结（真冻住）
      if(e.burn>0){ e.burn-=dt; e.hp-=25*dt;                 // v11 点燃 dot 25/s ×6s
        if(e.hp<=0&&!e.dead){ e.dead=true; this.onKill(e); } }
      if(e.kind==='dj1'||e.kind==='lfj'){ e.x-=e.spd*dt;
        if(!e.fired&&e.x<S.x){ e.fired=true; } // 玩家飞过其左侧才开火（frame_10→12）
        if(e.fired&&Math.random()<dt*1.2&&e.x<FIELD_W&&e.x>S.x){ // 瞄准弹
          const v=aimed(e.x,e.y,S.x,S.y,150); this.eshoot(e,v.vx,v.vy); }
        if(e.x<-30) e.dead=true, e.gone=true;
      } else {
        if(e.x>e.hoverX) e.x-=140*dt*fs; else if(fs>0) e.x=e.hoverX+Math.sin(e.t*0.7+e.bob)*18;
        if(fs>0) e.y=clamp(e.y+Math.sin(e.t*1.8+e.bob)*14*dt, 55, 205); // 浮动不出可达带
        e.fireT-=dt*fs;
        if(e.fireT<=0&&e.x<FIELD_W+5&&this.lock<=0&&this.freezeT<=0){ e.fireT=1.5+Math.random()*0.9;
          const sp=e.def.zdsd||150; const v=aimed(e.x,e.y,S.x,S.y,sp); this.eshoot(e,v.vx,v.vy);
          if(e.kind==='dj2'||e.kind==='dj3'){ const v2=aimed(e.x,e.y,S.x,S.y+40,sp); this.eshoot(e,v2.vx,v2.vy); } }
        if(e.x<180) e.x=180;
      }
      // 敌机撞玩家
      if(this.invuln<=0&&this.lock<=0&&hit(e,S)) this.playerHit();
    }
    this.enemies=this.enemies.filter(e=>!e.dead&&!e.gone);

    // boss（boss1/boss2 招式分家；boss2 两阶段 4000 总血，2000 处换形）
    if(this.boss){ const b=this.boss; const bfs=this.freezeT>0?0:1; b.pt+=dt*bfs; b.patT+=dt*bfs;
      if(b.kind==='boss2'&&!b.phase2&&b.hp<=2000){ b.phase2=true; this.score+=1000; this.log('score '+this.score);
        this.ebullets.length=0; this.say('boss2 变形!'); }
      if(b.phase==='enter'){ b.x-=90*dt; if(b.x<=360){b.x=360;b.phase='fight';this.scrollSpd=N.scroll;} }
      else { b.y=125+Math.sin(b.pt*0.9)*30;
        const cd=b.kind==='boss2'?(b.phase2?1.8:2.2):2.4;
        if(b.patT>cd&&this.lock<=0&&this.freezeT<=0){ b.patT=0; b.pat=(b.pat+1)%3;
          if(b.kind==='boss2'&&b.pat===0){ for(const dy of[-40,0,40]){ // 62 f19：三连瞄准 ±40
              const v=aimed(b.x,b.y,S.x,S.y+dy,b.phase2?172:150); this.eshoot(b,v.vx,v.vy); } }
          else if(b.kind==='boss2'&&b.pat===1){ b.win18=6; b.winT=0; } // 62 f5：6轮×3=18 连发窗
          else if(b.kind==='boss2'){ for(const a of[-0.3,0,0.3]){ const v=aimed(b.x,b.y,S.x,S.y,150);
              const c=Math.cos(a),s2=Math.sin(a); this.eshoot(b,v.vx*c-v.vy*s2,v.vx*s2+v.vy*c); } }
          else if(b.pat===0){ for(const a of[-0.22,0,0.22]){ // boss1 三向瞄准扇
              const v=aimed(b.x,b.y,S.x,S.y,163); const c=Math.cos(a),s=Math.sin(a);
              this.eshoot(b,v.vx*c-v.vy*s,v.vx*s+v.vy*c); } }
          else if(b.pat===1){ for(let i=0;i<10;i++){ const a=i/10*6.28+b.pt; // szd2 环形
              this.eshoot(b,Math.cos(a)*120,Math.sin(a)*120,'szd2'); } }
          else { for(let i=0;i<3;i++) setTimeout(()=>{ if(game===this&&this.boss&&!this.boss.dead&&this.state==='playing'&&this.freezeT<=0)
                { const v=aimed(this.boss.x,this.boss.y,this.ship.x+i*30-30,this.ship.y,175); this.eshoot(this.boss,v.vx,v.vy); } }, i*120); } } }
      if(b.win18>0){ b.winT-=dt; if(b.winT<=0){ b.winT=0.36; b.win18--;   // 18 连发窗：±80 三连×6 轮
          for(const dy of[-80,0,80]){ const v=aimed(b.x,b.y,S.x,S.y+dy,b.phase2?180:160); this.eshoot(b,v.vx,v.vy); } } }
      if(this.invuln<=0&&this.lock<=0&&hit(b,S)) this.playerHit(); }

    // ③ 长虹贯日：全屏剑气（宽度=18+15×僚机），命中点燃 3s
    if(this.guanri){ const g=this.guanri; g.t-=dt; g.x+=680*dt;   // v12 巨剑前推（修复：旧判定用未定义 g.h→NaN 恒假=零伤害）
      const tgts=[...this.enemies]; if(this.boss&&!this.boss.dead) tgts.push(this.boss);
      for(const e of tgts) if(!e.dead&&!g.hit.has(e)&&e.x>S.x-20&&Math.abs(e.y-g.y)*2<g.w+(e.h||20)){
        g.hit.add(e); this.damage(e,g.dmg); e.burn=6;
        this.booms.push({x:e.x,y:e.y,t:.25,spark:true}); }
      if(g.t<=0||g.x>FIELD_W+120) this.guanri=null; }
    // ③ 火凤燎原：掠场点燃+持续伤害（对点燃×1.5）
    if(this.phoenix2){ const p=this.phoenix2; p.t-=dt; p.x+=p.vx*dt; p.y=S.y+60*Math.sin(this.t*3);
      this.booms.push({x:p.x-50,y:p.y+(Math.random()-.5)*50,t:.35,spark:true}); // 火羽粒子
      const tgts=[...this.enemies]; if(this.boss&&!this.boss.dead) tgts.push(this.boss);
      for(const e of tgts) if(!e.dead&&Math.abs(e.x-p.x)<70&&Math.abs(e.y-p.y)<60){
        if(e.burn>0) this.unlock('rifeng');
        if(!p.hit.has(e)){ p.hit.add(e); e.burn=6; }
        this.damage(e,(e.burn>0?220:150)*dt); }
      if(p.t<=0||p.x>FIELD_W+60) this.phoenix2=null; }

    // 凤凰持续伤害（无敌伤害场，-2/帧→50/s）
    if(this.phoenix){ const p=this.phoenix; p.w=p.w||74; p.h=p.h||41;
      if(p.static){ const mul=e=>(e.kind==='dj1'||e.kind==='dj3')?15:(e.kind==='dj2'||e.kind==='dj4')?10:30;
        for(const e of this.enemies) if(hit(p,e)) this.damage(e,mul(e)*this.lv*25*dt);
        if(this.boss&&hit(p,this.boss)) this.damage(this.boss,30*this.lv*25*dt); }
      else { for(const e of this.enemies) if(hit(p,e)) this.damage(e,p.dps*dt); } }

    // 玩家弹
    for(const b of this.bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.sine){ b.sine.ph+=dt*b.sine.freq; b.y+=Math.cos(b.sine.ph)*b.sine.amp*dt; } // S 阵列
      if(b.pierce) b.dist+=Math.hypot(b.vx,b.vy)*dt;
      for(const e of this.enemies) if(!e.dead&&hit(b,e)){ SFX.play('hit');
        if(b.pierce){ if(!b.hitSet) b.hitSet=new Set(); if(b.hitSet.has(e)) continue; b.hitSet.add(e);
          let d=b.dmg;
          if(this.freezeT>0&&b.art==='bingpoj'){ d*=2; this.unlock('dong_sui'); // 冻→碎 ×2
            this.booms.push({x:e.x,y:e.y,t:0.3,shard:true}); }
          this.damage(e,d);
          if(b.art==='bingpoj'){ this.needles=Math.min(this.lv*(2+this.lv),this.needles+1); // 剑哺针（v12 容量公式）
            if(b.hitSet.size>=2) this.unlock('jian_bu_zhen'); }
          if(b.wallId){ this.wallHits[b.wallId]=(this.wallHits[b.wallId]||0)+1;
            if(this.wallHits[b.wallId]>=3) this.unlock('yi_xian_chuan');
            if(this.wallHits[b.wallId]>=5) this.unlock('man_zhen'); }
          if(b.dmg>=50) this.booms.push({x:e.x,y:e.y,t:0.18,big:false}); }
        else { this.damage(e,b.dmg); b.x=1e4; break; } }
      if(this.boss&&!this.boss.dead&&b.x<1e3&&hit(b,this.boss)){ this.damage(this.boss,b.dmg); b.x=1e4; } }
    this.bullets=this.bullets.filter(b=>b.x<FIELD_W+30&&b.y>-20&&b.y<FIELD_H+20);
    this.bullets=this.bullets.filter(b=>!(b.maxD&&b.dist>b.maxD));

    // 敌弹
    for(const b of this.ebullets){ b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(this.shield>0&&hit(b,{x:S.x,y:S.y,w:45,h:45})) b.x=1e4;      // 护盾清弹
      if(!b.frozen&&this.invuln<=0&&this.lock<=0&&hit(b,S)){ b.x=1e4; this.playerHit(); } // v11 冰晶弹=无害装饰
      else if(!b.frozen&&this.invuln<=0&&this.neng>0&&Math.hypot(b.x-S.x,b.y-S.y)<16) this.chargeGraze++; }
    this.ebullets=this.ebullets.filter(b=>b.x>-20&&b.x<FIELD_W+20&&b.y>-20&&b.y<FIELD_H+20);

    // 道具（pow/bom1 漂向随机点，bbb 大拾取框）
    for(const it of this.items){ it.life-=dt;
      if(it.kind==='bs'){ if(it.free){ it.x+=it.vx*dt; it.y+=it.vy*dt; it.vx*=0.99; it.vy*=0.99; } }
      else { const v=aimed(it.x,it.y,it.tx,it.ty,28); it.x+=v.vx*dt; it.y+=v.vy*dt;
        if(Math.hypot(it.tx-it.x,it.ty-it.y)<6){ it.tx=20+Math.random()*350; it.ty=20+Math.random()*200; } }
      if(hit(it,{x:S.x,y:S.y,w:26,h:20})){
        it.life=-1; this.stats.pick++;
        if(it.kind==='pow'){ SFX.play('pow'); if(this.lv<5){ this.lv++; this.syncWings(); this.log('pow '+this.lv); this.say('武器升级 LV'+this.lv+'!'); }
          else { this.score+=1000; this.log('score '+this.score); this.say('满级 +1000 分'); } }
        else if(it.kind==='bom1'){ SFX.play('pow'); this.bomm=Math.min(this.bomm+1,7); this.log('bomb '+this.bomm); }
        else if(it.kind==='bs'){ const b={kind:'bsx',hp:1,def:{score:500},x:it.x,y:it.y,w:14,h:14,dead:false};
          this.onKill(b); } }
    }
    this.items=this.items.filter(i=>i.life>0);

    for(const bm of this.booms) bm.t-=dt;
    this.booms=this.booms.filter(b=>b.t>0);
  }
  eshoot(e,vx,vy,art){ if(this.ebullets.length>140) return;
    this.ebullets.push({x:e.x,y:e.y,vx,vy,w:7,h:7,art:art||'szd'}); }
  playerHit(){ // 死亡循环：lv=1 僚机自散 + 原地掉 pow 补偿 + life-1 重生
    if(this.invuln>0||this.lock>0) return;
    this.booms.push({x:this.ship.x,y:this.ship.y,t:0.6,big:true});
    SFX.play('boomP',0.5);
    this.lv=1; this.wings.length=0; this.neng=0; this.phoenix=null; this.wingBurst=0; this.needles=0; this.stats.hits++;
    this.items.push(this.mkItem('pow',this.ship.x,this.ship.y));
    this.life--; this.log('life '+Math.max(this.life,0)); this.log('respawn');
    this.bomm=3; this.shield=1.2; // 重生三件套（die f23-25）：炸弹回满+白送 30 帧护盾
    this.ship.x=-20; this.ship.y=100; this.invuln=1.8; this.flyIn=true;
    if(this.life<0) this.fail();
  }

  // ---------- 渲染 ----------
  render(ctx){
    // 背景卷轴（434 原版关1背景带）
    const bw=this.bgW, off=-(this.scrollX%bw);
    for(let x=off;x<FIELD_W;x+=bw) drawArt(ctx,this.bgKey,x+bw/2,FIELD_H/2,bw,FIELD_H);
    if(this.state==='select'){ this.renderSelect(ctx); return; }
    ctx.save();
    if(this.shake>0) ctx.translate((Math.random()-.5)*10*this.shake,(Math.random()-.5)*10*this.shake);
    // 道具
    for(const it of this.items) drawArt(ctx,it.kind==='bs'?'bs':it.kind,it.x,it.y);
    // 敌机
    for(const e of this.enemies){ const fl=e.flash>0?1-e.flash/0.09:0;
      drawArt(ctx,e.kind,e.x,e.y,e.def?undefined:undefined,undefined,0,fl);
      if(this.freezeT>0){ ctx.globalAlpha=.62;                          // v11 冰壳（真冻住的样子）
        drawArt(ctx,'bingfeng',e.x,e.y,(e.w||24)+16,(e.h||20)+16); ctx.globalAlpha=1; }
      if(e.burn>0) drawArt(ctx,'dianran',e.x+11,e.y+17,12,15);           // 点燃标记
      if(fl>0){ ctx.globalAlpha=fl*0.85; ctx.fillStyle='#fff';
        ctx.fillRect(e.x-(e.w||24)/2-2,FIELD_H-e.y-(e.h||20)/2-2,(e.w||24)+4,(e.h||20)+4); ctx.globalAlpha=1; } }
    if(this.boss) drawArt(ctx,this.boss.kind==='boss2'?(this.boss.phase2?'boss2b':'boss2'):'boss1',this.boss.x,this.boss.y);
    // 凤凰
    if(this.phoenix){ const p=this.phoenix;
      drawArt(ctx,'phoenix',p.x,p.y,46,52,-0.2); ctx.globalAlpha=0.4;
      drawArt(ctx,'phoenix',p.x-18,p.y,46,52,-0.35); ctx.globalAlpha=1; }
    // 玩家 + 僚机 + 焰
    const S=this.ship;
    if(this.invuln<=0||Math.floor(this.t*12)%2===0){
      for(const w of this.wings) drawArt(ctx,N.ships[this.shipKey].wing,w.x,w.y);
      if(this.shipKey==='lantu'&&this.needles>0){ const per=2+this.lv, rows=this.lv,
            sc=1+0.8*clamp(this.neng/Math.max(1,N.ships.lantu.ps),0,1);   // v12 针架：蓄力放大
        for(let i=0;i<this.needles;i++){ const row=Math.floor(i/per), col=i%per;
          drawArt(ctx,'yinzhen',S.x-26-(per-1-col)*11,S.y+(row-(rows-1)/2)*13,24*sc,7*sc); } }
      drawArt(ctx,'flame',S.x-18,S.y,10+Math.random()*4,11+Math.random()*4);
      drawArt(ctx,this.shipKey,S.x,S.y); }
    if(this.shield>0){ ctx.globalAlpha=clamp(this.shield/0.4,0,1)*0.8;
      drawArt(ctx,'shield',S.x,S.y,45,45); ctx.globalAlpha=1; }
    if(this.readyFx>0){ const k=1-this.readyFx/0.14; ctx.save(); ctx.translate(S.x+16,FIELD_H-S.y);
      ctx.strokeStyle='rgba(255,212,121,'+(0.9*(1-k)).toFixed(2)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,3+k*11,0,6.29); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,'+(0.8*(1-k)).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(0,0,2.4-k*1.6,0,6.29); ctx.fill(); ctx.restore(); }
    // 子弹
    for(const b of this.bullets) drawArt(ctx,b.art||N.ships[this.shipKey].bullet,b.x,b.y,b.aw||b.w,b.ah||b.h);
    for(const b of this.ebullets){ if(b.frozen&&this.freezeT<1&&Math.floor(this.t*10)%2===0) continue; // 渐融闪烁
      drawArt(ctx,b.frozen?'bingjing':(b.art||'szd'),b.x,b.y); }
    if(this.guanri){ const g=this.guanri, sc=1+0.28*this.lv, fade=clamp(g.t/1.4,0,1);  // v12 贯日巨剑+剑气带
      ctx.globalAlpha=0.5*fade; drawArt(ctx,'guanri',FIELD_W/2,g.y,FIELD_W-10,g.w);      // 剑气带
      if(this.lv>=4){ ctx.globalAlpha=0.35*fade; drawArt(ctx,'guanri',FIELD_W/2,g.y+3,FIELD_W-10,g.w*1.15); }
      ctx.globalAlpha=Math.min(1,fade+0.3);
      drawArt(ctx,'changhong',g.x,g.y,96*sc,29*sc);                                      // 巨剑实体（随lv放大）
      ctx.globalAlpha=1; }
    if(this.phoenix2){ const p=this.phoenix2; ctx.globalAlpha=.35; drawArt(ctx,'huofeng',p.x-26,p.y,120,94,-0.15); ctx.globalAlpha=1; // ③ 火凤（残影+本体+火羽拖尾）
      drawArt(ctx,'huofeng',p.x,p.y,120,94,-0.08);
      for(let i=1;i<=4;i++){ ctx.globalAlpha=.5-.1*i; drawArt(ctx,'huofeng',p.x-40*i-20,p.y+8*i*(i%2?1:-1),90-14*i,70-10*i,-0.2); } ctx.globalAlpha=1; }
    // 爆炸
    for(const bm of this.booms){ const k=1-bm.t/(bm.big?0.8:bm.shard?0.3:0.5);
      ctx.globalAlpha=1-k;
      if(bm.spark){ ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.arc(bm.x,FIELD_H-bm.y,2.5*(1-k)+1,0,6.29); ctx.fill(); }
      else if(bm.shard) drawArt(ctx,'suibing',bm.x,bm.y,16*(1.6-k),16*(1.6-k));       // ③ 碎冰
      else drawArt(ctx,bm.big?'die':'boom',bm.x,bm.y,(bm.big?115:50)*(0.6+k),(bm.big?115:36)*(0.6+k)); ctx.globalAlpha=1; }
    if(this.bombFx){ const k=1-this.bombFx.t/2;
      ctx.globalAlpha=clamp(1-k,0,1)*0.9; ctx.strokeStyle='#ffd23f'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(FIELD_W/2,FIELD_H/2,k*FIELD_W*0.7,0,6.29); ctx.stroke();
      ctx.strokeStyle='#ff7b4f'; ctx.lineWidth=3; ctx.globalAlpha=clamp(1-k*1.3,0,1)*0.8;
      ctx.beginPath(); ctx.arc(FIELD_W/2,FIELD_H/2,k*FIELD_W*0.55,0,6.29); ctx.stroke(); ctx.globalAlpha=1;
      drawArt(ctx,'boom',FIELD_W/2,FIELD_H/2,120*(0.6+k),90*(0.6+k)); }
    if(this.flashT>0){ ctx.globalAlpha=clamp(this.flashT/0.4,0,1)*0.75; ctx.fillStyle='#fff';
      ctx.fillRect(0,0,FIELD_W,FIELD_H); ctx.globalAlpha=1; }
    if(this.freezeT>0){ ctx.globalAlpha=clamp(this.freezeT/3,0,1)*0.5;           // ③ 冰封千里霜爆
      drawArt(ctx,'bingfeng',FIELD_W/2,FIELD_H/2,FIELD_W*0.9,FIELD_H*0.9); ctx.globalAlpha=1; }
    ctx.restore();
    if(this.tintFx){ ctx.fillStyle='rgba('+this.tintFx.c+','+(clamp(this.tintFx.t/1.3,0,1)*0.22).toFixed(2)+')';
      ctx.fillRect(0,0,FIELD_W,FIELD_H); }
    this.renderHUD(ctx);
    if(this.msgT>0){ ctx.globalAlpha=clamp(this.msgT,0,1);
      ctx.fillStyle='#ffe08a'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
      ctx.fillText(this.msg,FIELD_W/2,FIELD_H-100); ctx.globalAlpha=1; }
    if(this.unlockFx){ const u=this.unlockFx, k=1-u.t/2.5;      // 悟·大字上浮渐隐
      ctx.globalAlpha=clamp(u.t,0,1); ctx.textAlign='center';
      ctx.fillStyle='#ffd23f'; ctx.font='bold 22px serif';
      ctx.fillText('悟 · '+u.n, FIELD_W/2, FIELD_H-70-k*30);
      ctx.strokeStyle='rgba(255,210,63,.6)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(FIELD_W/2,FIELD_H-76-k*30,26+8*Math.sin(k*6.28),0,6.29); ctx.stroke();
      ctx.globalAlpha=1; }
  }
  renderHUD(ctx){
    ctx.save(); ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,FIELD_W,16);
    ctx.fillStyle='#fff'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('第'+(this.levelIdx+1)+'关 '+this.score, 5, 11);
    ctx.fillText('LV'+this.lv, 70, 11);
    ctx.fillText('悟 '+CODEX.filter(c=>codexUnlocked[c[0]]).length+'/'+CODEX.length+' (C)', 200, 11);
    // 蓄能条
    const ps=N.ships[this.shipKey].ps, nw=60;
    ctx.fillStyle='#333'; ctx.fillRect(100,4,nw,7);
    ctx.fillStyle=this.fashez>0?'#666':(this.neng>=ps?'#ffd23f':'#4fa8ff'); ctx.fillRect(100,4,nw*this.neng/ps,7);
    ctx.strokeStyle='#888'; ctx.strokeRect(100,4,nw,7);
    if(this.shipKey==='lantu') for(let i=0;i<this.needles;i++) drawArt(ctx,'yinzhen',168+i*8,8,8,2.4); // 银针存量
    // 宝（bom1 图标）与命（小飞机）
    for(let i=0;i<this.bomm;i++) drawArt(ctx,'bom1',178+i*14,10,12,5);
    for(let i=0;i<Math.max(this.life,0);i++) drawArt(ctx,this.shipKey,FIELD_W-8-i*13,9,10,11);
    if(this.boss&&this.boss.phase==='fight'){ // boss 血条
      ctx.fillStyle='#300'; ctx.fillRect(60,FIELD_H-8,FIELD_W-120,5);
      ctx.fillStyle='#f44'; ctx.fillRect(60,FIELD_H-8,(FIELD_W-120)*Math.max(this.boss.hp,0)/this.boss.def.hp,5); }
    ctx.restore();
  }
  renderSelect(ctx){
    ctx.fillStyle='rgba(6,10,26,.82)'; ctx.fillRect(0,0,FIELD_W,FIELD_H);
    ctx.fillStyle='#ffd23f'; ctx.font='bold 17px sans-serif'; ctx.textAlign='center';
    ctx.fillText('选择侠士', FIELD_W/2, FIELD_H-28);
    ctx.font='10px sans-serif'; ctx.fillStyle='#9ab';
    ctx.fillText('A/D 或 ←/→ 切换 · J 或点击确认', FIELD_W/2, 14);
    const cards=[{k:'hongmao',n:'虹猫',d:'长虹剑·重击0.7s·蓄力→贯日巨剑+僚机S阵列·K火凤'},{k:'lantu',n:'蓝兔',d:'快射0.4s·每发攒银针·蓄力→冰魄剑+针雨齐发·K冰封'}];
    cards.forEach((c,i)=>{ const cx=FIELD_W/4+i*FIELD_W/2, cy=FIELD_H/2-6, on=this.selIdx===i;
      ctx.globalAlpha=on?1:0.45;
      ctx.strokeStyle=on?'#ffd23f':'#567'; ctx.lineWidth=on?2.5:1;
      ctx.strokeRect(cx-62,cy-52,124,110);
      drawArt(ctx,c.k,cx,cy+6,64,68);
      ctx.fillStyle=on?'#ffd23f':'#9ab'; ctx.font='bold 14px sans-serif';
      ctx.fillText(c.n,cx,cy-34);
      ctx.font='9px sans-serif'; ctx.fillStyle='#789'; ctx.fillText(c.d,cx,cy+46);
      ctx.globalAlpha=1; });
  }
}
function restart(){ document.getElementById('panel').style.display='none';
  document.getElementById('result').style.display='none';
  game=new Game(); }
// ---------- ⑤ 领悟图鉴面板（C 键开关；跨 run 持久 localStorage） ----------
const codexEl=document.getElementById('codex');
function toggleCodex(){ if(codexEl.style.display==='flex'){ codexEl.style.display='none'; return; }
  const n=CODEX.filter(c=>codexUnlocked[c[0]]).length;
  document.getElementById('codexN').textContent=n+'/'+CODEX.length;
  document.getElementById('codexList').innerHTML=CODEX.map(c=>codexUnlocked[c[0]]
    ? `<div class="cx"><b>${c[1]}</b><i>触发：${c[2]}</i><em>增益：${c[3]}</em></div>`
    : `<div class="cx"><b>${c[1]}</b><i class="lk">？</i></div>`).join('');
  codexEl.style.display='flex'; }
codexEl.addEventListener('click',()=>codexEl.style.display='none');

// ---------- 主循环（变步长 px/秒，GDD 再创口径） ----------
const ctx=cv.getContext('2d');
let game=new Game(), last=performance.now(), acc=0;
const STEP=1/60;
function frame(now){
  try{ let dt=Math.min((now-last)/1000,0.1); last=now; acc+=dt;
    while(acc>=STEP){ game.update(STEP); jEdge=false; kEdge=false; acc-=STEP; }
    game.render(ctx); }
  catch(err){ console.error('[hmlt] frame error',err); } // 逻辑异常不再炸死主循环
  requestAnimationFrame(frame);
}
imgTimer=setInterval(()=>{ if(imgsLeft<=0){ clearInterval(imgTimer);
  // 加载完成才开始渲染循环（SVG 全就位）
  } },100);
requestAnimationFrame(frame);

// 画布自适应窗口
function fit(){ const s=Math.min(innerWidth/FIELD_W,(innerHeight-40)/FIELD_H);
  cv.style.width=(FIELD_W*s|0)+'px'; cv.style.height=(FIELD_H*s|0)+'px'; }
addEventListener('resize',fit); fit();
if('ontouchstart' in window) document.getElementById('bombBtn').style.display= game.state==='select'?'none':'block';
</script>
